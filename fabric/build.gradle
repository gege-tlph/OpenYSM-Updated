plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        java.exclude 'rip/ysm/compat/touhoulittlemaid/fabric/tlm/**'
    }
    test {
        java {
            srcDir rootProject.file('common/src/test/java')
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

configurations {
    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    include "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation("dev.architectury:architectury-fabric:$rootProject.architectury_api_version") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    include "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation "dev.architectury:architectury-injectables:1.0.10"

    modImplementation "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"
    include "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"
    implementation "com.electronwill.night-config:core:3.8.1"
    implementation "com.electronwill.night-config:toml:3.8.1"

    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"

    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    include "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"

    // Optional shader integration is pinned to the 26.1 line; it is compile-only.
    modCompileOnly "maven.modrinth:iris:1.10.9+26.1-fabric"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // TLM is intentionally absent from the first 26.1.2 playable node. The
    // compat package remains source-compatible but does not gate this build.

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    from(project(':common').sourceSets.main.resources)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

// The 26.1.2 layered mapping is intentionally a compile/runtime bridge and
// does not provide a complete intermediary namespace for Loom source remapping.
// Keep the regular sources JAR; the playable remapped mod JAR remains enabled.
tasks.named('remapSourcesJar') {
    enabled = false
}

test {
    useJUnitPlatform()
    // G2 requires the contract tests to actually run; a silent NO-SOURCE run
    // would otherwise pass the gate without executing anything.
    failOnNoDiscoveredTests = true
}

// G3 artifact smoke: assert the *packaged* jar, not the source tree. The
// rip.ysm.port26 contract tests only ever inspected common/src, so a packaging
// regression (missing natives, stray Minecraft classes, dev-shadow leakage)
// could not be caught before this task existed.
tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verify the remapped Fabric jar contains exactly the expected shipped contents.'
    dependsOn tasks.named('remapJar')

    doLast {
        def jarFile = tasks.named('remapJar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("remapped jar not found: ${jarFile}")
        }

        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.entries().each { entries << it.name }
        }

        def problems = []
        def requireEntry = { String path ->
            if (!entries.contains(path)) { problems << "missing required entry: ${path}" }
        }

        requireEntry 'fabric.mod.json'
        requireEntry 'yes_steve_model.mixins.json'
        requireEntry 'yes_steve_model_fabric.mixins.json'
        requireEntry 'com/elfmcys/yesstevemodel/YesSteveModel.class'
        requireEntry 'native-manifest.json'

        def natives = entries.findAll { it.startsWith('natives/') && !it.endsWith('/') }
        if (natives.size() != 6) {
            problems << "expected 6 native artifacts, found ${natives.size()}: ${natives}"
        }

        def builtin = entries.findAll { it.startsWith('assets/yes_steve_model/builtin/') && !it.endsWith('/') }
        if (builtin.size() != 621) {
            problems << "builtin resource corpus in jar changed: expected 621, found ${builtin.size()}"
        }
        def descriptors = builtin.findAll { it.endsWith('.ysm') || it.endsWith('/ysm.json') }
        if (descriptors.size() != 27) {
            problems << "builtin model descriptors in jar changed: expected 27, found ${descriptors.size()}"
        }

        def minecraftClasses = entries.findAll { it.startsWith('net/minecraft/') }
        if (!minecraftClasses.isEmpty()) {
            problems << "jar leaks ${minecraftClasses.size()} Minecraft classes (first: ${minecraftClasses[0]})"
        }
        def sparkleLeaks = entries.findAll { it.toLowerCase().contains('sparkle_morpher') || it.contains('com/micaftic/') }
        if (!sparkleLeaks.isEmpty()) {
            problems << "jar leaks donor identity: ${sparkleLeaks.take(3)}"
        }
        if (jarFile.name.contains('dev-shadow')) {
            problems << "verified the dev-shadow jar instead of the remapped jar: ${jarFile.name}"
        }

        def modJson = null
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            modJson = zip.getInputStream(zip.getEntry('fabric.mod.json')).text
        }
        if (!(modJson =~ /"id"\s*:\s*"yes_steve_model"/)) {
            problems << 'fabric.mod.json no longer declares mod id yes_steve_model'
        }
        if (modJson.contains('${version}')) {
            problems << 'fabric.mod.json version placeholder was not expanded'
        }

        if (problems) {
            throw new GradleException("verifyReleaseJar failed:\n  - " + problems.join('\n  - '))
        }
        logger.lifecycle("verifyReleaseJar OK: ${jarFile.name} (${jarFile.length()} bytes, ${entries.size()} entries, ${natives.size()} natives, ${builtin.size()} builtin files)")
    }
}
