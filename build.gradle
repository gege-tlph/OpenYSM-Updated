plugins {
    id 'dev.architectury.loom' version '1.17.487' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.2.2' apply false
    // Quality gate: bytecode static analysis, report-only (see the subprojects block below
    // for why it does not fail the build yet). Mirrors the tlm-tsumugi sibling project's setup.
    id 'com.github.spotbugs' version '6.5.10' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.github.spotbugs'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        flatDir {
            dirs rootProject.file('libs')
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroup "org.spongepowered"
            }
        }
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org/releases"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            mappings file(rootProject.file('fabric/mappings/mapping.tiny'))
        }

        // Architecture assertions that read **bytecode**, not source text. The port26 contract
        // tests mostly scan source strings, which has already misfired twice (comment-stripping
        // missed a javadoc; a button-literal match silently went to zero coverage after the
        // literal became a constant). ArchUnit walks the actual call graph and field accesses,
        // so it is not fooled by comments, formatting, or how a literal is spelled. Shared with
        // :fabric via the `common/src/test/java` srcDir wired up in fabric/build.gradle, so it
        // only needs declaring once here. Same version as the tlm-tsumugi sibling project.
        testImplementation "com.tngtech.archunit:archunit:1.4.1"
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked',
                '-nowarn'
        ])
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }

    // ------------------------------------------------------------------------------------------
    // Quality gate: SpotBugs (2026-08-31, ported alongside the ArchUnit rules above).
    //
    // Report-only, same as the tlm-tsumugi sibling project: it DOES run as part of `check`
    // (the plugin wires spotbugsMain into it) but `ignoreFailures = true` keeps it from failing
    // the build. This repo's gate ladder (TEST_GATES.md) does not call it out as a blocking
    // gate either, for the same reason tlm-tsumugi withheld it: a brand-new static-analysis gate
    // needs to be proven to actually go red on a real defect before it is trusted to block a
    // build — see docs/porting/26.1.2/EVIDENCE.md for what this run found. Reports land in
    // <module>/build/reports/spotbugs/main.html; nothing here reads them automatically.
    // ------------------------------------------------------------------------------------------
    spotbugs {
        ignoreFailures = true
        showStackTraces = false
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
        effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    }

    tasks.named('spotbugsMain') {
        reports {
            html { required = true }
            xml { required = false }
        }
    }

    // Test-only classes (JUnit contract tests, mock harnesses) are low value and noisy here.
    tasks.matching { it.name == 'spotbugsTest' }.configureEach { enabled = false }
}
